<!doctype html>
<html lang="en" data-spki-workspace>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPKI workspace</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 14px system-ui, sans-serif; color: #20242a; background: #f7f8fa; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #dce0e5; background: white; flex: none; }
  header a { color: inherit; text-decoration: none; font-weight: 650; white-space: nowrap; }
  select { min-width: 0; max-width: 32rem; flex: 1; }
  select, button { font: inherit; padding: 6px 9px; border: 1px solid #bfc6cf; border-radius: 5px; background: white; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  #status { color: #626b77; font-size: 12px; }
  #project-preview { width: 100%; border: 0; flex: 1; min-height: 0; background: white; }
  main { padding: 24px; overflow: auto; }
  main h1 { font-size: 22px; }
  main li { margin: 12px 0; }
  code { background: #e9edf2; padding: 2px 4px; border-radius: 3px; }
  @media (max-width: 480px) { header { gap: 6px; padding: 8px; } #status { display: none; } }
</style>
<script src="/__spki/workspace.js" defer></script>
</head>
<body>
<header>
  <a href="/__spki/workspace">SPKI</a>
  <label for="project">Project</label>
  <select id="project" aria-label="Project"><!--OPTIONS--></select>
  <button id="reload" type="button" disabled>Reload</button>
  <span id="status" role="status"></span>
</header>
<!--PREVIEW-->
</body>
</html>
