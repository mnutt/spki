[package]
name = "spki"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
spki-common = { path = "../spki-common" }
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"
libc = "0.2"
capnp.workspace = true
capnp-compiler.workspace = true
ed25519-dalek = "3"
sha2 = "0.11"
lzma-rust2 = "0.23"
getrandom = "0.4"
rolldown = "=1.3.1"
rolldown_common = "=1.3.1"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["bundler"] }
oxc_allocator = "0.157.0"
oxc_parser = "0.157.0"
oxc_span = "0.157.0"
oxc_ast = "0.157.0"
oxc_ast_visit = "0.157.0"
oxc_semantic = "0.157.0"
oxc_transformer = "0.157.0"
oxc_codegen = "0.157.0"
rquickjs = "=0.14.0"

[build-dependencies]
capnpc.workspace = true
capnp-compiler.workspace = true
