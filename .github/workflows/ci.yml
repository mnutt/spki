name: CLI builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      runtime_ready:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    if: ${{ !inputs.runtime_ready }}
    uses: ./.github/workflows/runtime.yml
  cli:
    needs: runtime
    if: ${{ !cancelled() && (needs.runtime.result == 'success' || inputs.runtime_ready) }}
    name: spki / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Cap'n Proto (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev
      - name: Install Cap'n Proto (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp
      - name: Set up Rust
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: spki-runtime
          path: build
      - name: Embed runtime in CLI builds
        run: echo "SPKI_RUNTIME_BUNDLE=$GITHUB_WORKSPACE/build/runtime.xz" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked --workspace
      - name: Build CLI
        run: cargo build --locked --release -p spki --bin spki
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host regression checks
        env:
          SPKI_TEST_BINARY: ${{ github.workspace }}/target/release/spki
        run: python3 scripts/check-host.py --embedded-runtime
      - name: Compare embedded and official schema compilers
        run: cargo test --locked -p spki --lib -- --ignored
      - name: Package CLI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          target/release/spki --version
          mkdir -p dist
          tar -czf "dist/spki-${TARGET}.tar.gz" -C target/release spki
          cd dist
          shasum -a 256 "spki-${TARGET}.tar.gz" > "spki-${TARGET}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: spki-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
