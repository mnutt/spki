name: Previewer SPK

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      runtime_ready:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    if: ${{ !inputs.runtime_ready }}
    uses: ./.github/workflows/runtime.yml
  previewer:
    needs: runtime
    if: ${{ !cancelled() && (needs.runtime.result == 'success' || inputs.runtime_ready) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev
      - name: Set up Rust
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: previewer
      - uses: actions/download-artifact@v4
        with:
          name: spki-runtime
          path: build
      - name: Embed runtime in packager
        run: echo "SPKI_RUNTIME_BUNDLE=$GITHUB_WORKSPACE/build/runtime.xz" >> "$GITHUB_ENV"
      - name: Prepare signing directory
        run: |
          umask 077
          mkdir -p "$HOME/.sandstorm"
      - name: Restore signing identity
        # PR builds always use a disposable identity, without repository secrets.
        if: github.event_name != 'pull_request'
        env:
          TEST_KEYRING: ${{ secrets.SANDSTORM_TEST_KEYRING_B64 }}
          TEST_APP_ID: ${{ vars.SANDSTORM_TEST_APP_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.sandstorm"
          if [[ -n "$TEST_KEYRING" && -n "$TEST_APP_ID" ]]; then
            printf '%s' "$TEST_KEYRING" | base64 --decode > "$HOME/.sandstorm/sandstorm-keyring"
            printf '%s\n' "$TEST_APP_ID" > .sandstorm/sandstorm-test-app-id
          fi
      - name: Build and verify SPK
        run: |
          set -euo pipefail
          signing_args=()
          if [[ -f .sandstorm/sandstorm-test-app-id ]]; then
            signing_args=(--keyring "$HOME/.sandstorm/sandstorm-keyring" --app-id "$(cat .sandstorm/sandstorm-test-app-id)")
          fi
          # Commit time keeps the upgrade counter consistent across calling workflows.
          app_version=$(git show -s --format=%ct HEAD)
          label="$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then label="$GITHUB_REF_NAME"; fi
          cargo run --locked --release -p spki --example package-preview -- --test --app-version "$app_version" "${signing_args[@]}" --output "build/isolate-preview-test-${label}.spk"
          cd build
          sha256sum "isolate-preview-test-${label}.spk" > "isolate-preview-test-${label}.spk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: isolate-preview-spk
          path: |
            build/*.spk
            build/*.spk.sha256
          if-no-files-found: error
