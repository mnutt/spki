name: Previewer SPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  previewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev
      - name: Set up Rust
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: previewer
      - name: Build and stage previewer
        run: |
          python3 scripts/fetch-host.py
          cargo build --locked --release -p isolate-preview --bin isolate-preview
          # The staging script's input path also serves local debug builds.
          mkdir -p target/debug
          cp target/release/isolate-preview target/debug/isolate-preview
          python3 scripts/stage-preview.py
      - name: Prepare signing directory
        run: |
          umask 077
          mkdir -p "$HOME/.sandstorm"
      - name: Restore signing identity
        # PR builds always use a disposable identity, without repository secrets.
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYRING: ${{ secrets.SANDSTORM_KEYRING_B64 }}
          TEST_KEYRING: ${{ secrets.SANDSTORM_TEST_KEYRING_B64 }}
          TEST_APP_ID: ${{ vars.SANDSTORM_TEST_APP_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.sandstorm"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ -z "$RELEASE_KEYRING" ]]; then
              echo '::error::Set SANDSTORM_KEYRING_B64 to the previewer signing keyring before building a release tag.'
              exit 1
            fi
            printf '%s' "$RELEASE_KEYRING" | base64 --decode > "$HOME/.sandstorm/sandstorm-keyring"
          elif [[ -n "$TEST_KEYRING" && -n "$TEST_APP_ID" ]]; then
            printf '%s' "$TEST_KEYRING" | base64 --decode > "$HOME/.sandstorm/sandstorm-keyring"
            printf '%s\n' "$TEST_APP_ID" > .sandstorm/sandstorm-test-app-id
          fi
      - name: Build and verify SPK
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            cargo run --locked --release -p spki --example package-preview -- --keyring "$HOME/.sandstorm/sandstorm-keyring" --output "build/isolate-preview-${GITHUB_REF_NAME}.spk"
          else
            signing_args=()
            if [[ -f .sandstorm/sandstorm-test-app-id ]]; then
              signing_args=(--keyring "$HOME/.sandstorm/sandstorm-keyring" --app-id "$(cat .sandstorm/sandstorm-test-app-id)")
            fi
            cargo run --locked --release -p spki --example package-preview -- --test --app-version "$GITHUB_RUN_NUMBER" "${signing_args[@]}" --output "build/isolate-preview-test-${GITHUB_SHA}.spk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: isolate-preview-spk
          path: build/*.spk
          if-no-files-found: error
