name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['workspace']['package']['version']
          assert os.environ['TAG'] == 'v' + version, 'Tag must match the Cargo workspace version'
          PY
  runtime:
    needs: version
    uses: ./.github/workflows/runtime.yml
  cli:
    needs: runtime
    uses: ./.github/workflows/ci.yml
    with:
      runtime_ready: true
  previewer:
    needs: runtime
    uses: ./.github/workflows/spk.yml
    with:
      runtime_ready: true
    secrets: inherit
  publish:
    needs: [cli, previewer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: spki-*-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: isolate-preview-spk
          path: dist
      - name: Verify release assets
        working-directory: dist
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            test -s "spki-${target}.tar.gz"
            sha256sum -c "spki-${target}.tar.gz.sha256"
          done
          test -s "isolate-preview-test-${TAG}.spk"
          sha256sum -c "isolate-preview-test-${TAG}.spk.sha256"
        env:
          TAG: ${{ github.ref_name }}
      - name: Publish CLI and test previewer together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --draft "${flags[@]}" --title "spki ${TAG}" --generate-notes --notes 'Includes the standalone spki CLI for Linux and macOS, plus an Isolate Preview test SPK. The test SPK has a separate app identity from the production previewer.'
          gh release edit "$TAG" --draft=false
